<html>
  <head>
    <title>연습용블로그</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>환영한다.</h1>

    <div id="root"></div>

    <!-- React 라이브러리의 핵심 기능을 포함하고 있습니다. 
     React는 사용자 인터페이스(UI)를 구성하는 데에 사용되는 JavaScript 라이브러리입니다. 
     컴포넌트 기반 아키텍처를 제공하여 재사용 가능한 UI 컴포넌트를 만들 수 있도록 도와줍니다. -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <!-- React로 작성된 컴포넌트를 실제 DOM에 그려주는 기능을 담당합니다. 
     애플리케이션의 UI를 브라우저의 문서 개체 모델(DOM)에 연결하는 역할을 하며, 
     React 컴포넌트를 사용하여 만들어진 UI를 페이지에 렌더링하는 데 필요합니다. -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- crossorigin 속성은 CORS(Cross-Origin Resource Sharing) 정책을 따르는 브라우저에서 외부 리소스를 안전하게 불러오기 위해 사용됩니다.
    발생할 수 있는 에러나 경고를 더 쉽게 잡아낼 수 있도록 development 버전이 사용되고 있습니다. -->
    <script src="MyButton.js"></script>
  </body>
</html>
